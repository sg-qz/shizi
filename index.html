<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>识字启蒙台 · 小朋友的认字乐园</title>
<style>
  :root{
    --bg:#FFF7E6; --card:#FFFFFF; --primary:#FF8A3D; --primary-d:#F2701C;
    --secondary:#36C5A8; --secondary-d:#1FA98C; --accent:#FFD23F;
    --ink:#6B4423; --text:#3A2E25; --muted:#9A8A78; --red:#E8453C; --green:#2FA86A;
    --line:#F0E2CC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:17px; line-height:1.5;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  .topbar{
    position:sticky; top:0; z-index:30; background:linear-gradient(90deg,var(--primary),var(--accent));
    color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 10px rgba(255,138,61,.25);
  }
  .topbar h1{font-size:19px; margin:0; font-weight:800; letter-spacing:1px;}
  .topbar .sub{font-size:12px; opacity:.95; margin-top:1px;}
  .sync{margin-left:auto; display:flex; align-items:center; gap:5px; font-size:12px; background:rgba(255,255,255,.22); padding:4px 9px; border-radius:999px;}
  .sync svg{width:14px;height:14px;}
  .wrap{max-width:720px; margin:0 auto; padding:14px 14px 8px;}
  .card{background:var(--card); border-radius:22px; padding:16px; margin-bottom:14px; box-shadow:0 4px 14px rgba(120,90,40,.07);}
  .card h2{margin:0 0 10px; font-size:18px; display:flex; align-items:center; gap:8px;}
  .card h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);display:inline-block;}
  .muted{color:var(--muted); font-size:13px;}
  /* 今天要处理 */
  .today-head{display:flex; align-items:center; justify-content:space-between;}
  .ring{position:relative; width:54px;height:54px;}
  .ring svg{width:54px;height:54px; transform:rotate(-90deg);}
  .ring .num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:var(--primary-d);}
  .today-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .tchip{width:46px;height:46px; border-radius:14px; background:#FFF3E0; display:flex;align-items:center;justify-content:center; font-size:24px; font-weight:800; color:var(--ink); border:2px solid #FFE0B2;}
  .tchip.done{background:#E6F8EF; border-color:#BDEBD4; color:var(--green);}
  .tchip.over{background:#FFE9E7; border-color:#F7C4BF; color:var(--red);}
  .btn{
    border:none; border-radius:16px; padding:0 18px; min-height:50px; font-size:17px; font-weight:800;
    background:var(--primary); color:#fff; cursor:pointer; transition:transform .06s, filter .15s; width:100%;
  }
  .btn:active{transform:scale(.97);}
  .btn.sec{background:var(--secondary);}
  .btn.ghost{background:#FFF; color:var(--primary-d); border:2px solid var(--line);}
  .btn.yel{background:var(--accent); color:#7A5A10;}
  .btn.sm{min-height:42px; font-size:15px; width:auto; padding:0 14px; border-radius:13px;}
  .btn:disabled{filter:grayscale(.5); opacity:.55; cursor:not-allowed;}
  .row{display:flex; gap:10px;}
  .row>*{flex:1;}
  /* flip card */
  .stage{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .flip{width:min(70vw,260px); height:min(70vw,260px); perspective:1000px; cursor:pointer;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(120,90,40,.14); padding:14px; text-align:center;}
  .face.front{background:linear-gradient(160deg,#FFF6E9,#FFE9CC); border:3px solid #FFD9A8;}
  .face.back{background:linear-gradient(160deg,#EAF7F1,#D6F0E6); border:3px solid #B7E6D2; transform:rotateY(180deg);}
  .bigchar{font-size:120px; font-weight:800; color:var(--ink); line-height:1;}
  .py{margin-top:6px; font-size:20px; color:var(--primary-d); font-weight:700;}
  .pict{width:130px;height:130px;}
  .story{font-size:14px; color:var(--text); margin-top:6px; line-height:1.45;}
  .tag{display:inline-block; font-size:12px; padding:2px 10px; border-radius:999px; background:#FFF0D6; color:#B5731B; font-weight:700; margin-bottom:6px;}
  .progress{width:100%; height:12px; background:#F0E2CC; border-radius:999px; overflow:hidden; margin-top:6px;}
  .progress>i{display:block; height:100%; background:linear-gradient(90deg,var(--secondary),var(--accent)); border-radius:999px; transition:width .4s;}
  /* quiz */
  .qchar{font-size:96px; font-weight:800; color:var(--ink); text-align:center; margin:6px 0 2px;}
  .qhint{text-align:center; color:var(--muted); font-size:14px; margin-bottom:14px;}
  .opts{display:flex; flex-direction:column; gap:12px;}
  .opt{font-size:24px; font-weight:800; padding:16px; border-radius:18px; background:#FFF; border:3px solid var(--line); color:var(--ink); cursor:pointer; text-align:center;}
  .opt.ok{background:#E6F8EF; border-color:var(--green); color:var(--green);}
  .opt.no{background:#FFE9E7; border-color:var(--red); color:var(--red); animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  /* rewards */
  .stat{display:flex; gap:10px; margin-bottom:12px;}
  .stat .box{flex:1; background:linear-gradient(160deg,#FFF3E0,#FFE6C4); border-radius:18px; padding:12px; text-align:center;}
  .stat .box .v{font-size:30px; font-weight:800; color:var(--primary-d);}
  .stat .box .k{font-size:12px; color:var(--muted);}
  .rw{display:flex; align-items:center; gap:10px; background:#FAF4EA; border-radius:16px; padding:12px; margin-bottom:10px;}
  .rw .ic{width:42px;height:42px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;color:#7A5A10;}
  .rw .nm{flex:1; font-weight:700;}
  .rw .ct{font-weight:800; color:var(--secondary-d);}
  .rw .ct small{color:var(--muted); font-weight:600;}
  .empty{text-align:center; color:var(--muted); padding:22px; font-size:14px;}
  .toast{position:fixed; left:50%; top:22%; transform:translateX(-50%); background:rgba(58,46,37,.94); color:#fff; padding:12px 20px; border-radius:14px; font-size:15px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; max-width:80%; text-align:center;}
  .toast.show{opacity:1;}
  /* tabs */
  .tabs{position:fixed; left:0; right:0; bottom:0; z-index:40; background:#fff; display:flex; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1; border:none; background:none; padding:8px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:11px; cursor:pointer;}
  .tab svg{width:24px;height:24px;}
  .tab.active{color:var(--primary);}
  .tab.active svg{stroke:var(--primary);}
  .hide{display:none !important;}
  /* parent */
  .field{display:block; margin:10px 0;}
  .field label{font-size:13px; color:var(--muted); display:block; margin-bottom:5px;}
  .field input{width:100%; font-size:16px; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:#fff; min-height:48px;}
  .list-item{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .list-item .nm{flex:1; font-weight:700;}
  .list-item .meta{font-size:12px; color:var(--muted);}
  .del{background:#FFE9E7; color:var(--red); border:none; border-radius:10px; min-height:38px; padding:0 12px; font-weight:700; cursor:pointer;}
  .modal-mask{position:fixed; inset:0; background:rgba(40,30,20,.45); z-index:70; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:#fff; border-radius:22px; padding:22px; width:100%; max-width:340px; text-align:center;}
  .modal h3{margin:0 0 6px;}
  .modal p{color:var(--muted); font-size:13px; margin:0 0 14px;}
  .pin-input{font-size:28px; letter-spacing:14px; text-align:center; width:100%; padding:12px; border-radius:14px; border:2px solid var(--line); min-height:54px;}
  .badge{display:inline-block; background:var(--accent); color:#7A5A10; font-weight:800; padding:3px 12px; border-radius:999px; font-size:13px;}
  .nopic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px;}
  .bigpy{font-size:34px;font-weight:800;color:var(--primary-d);}
  .replay{display:block;margin:10px auto 0;}
  @media(min-width:721px){ .flip{width:260px;height:260px;} }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>识字启蒙台</h1>
    <div class="sub" id="greet">小朋友的认字乐园</div>
  </div>
  <div class="sync" id="syncBox" title="同步状态">
    <svg id="syncIcon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 16a4 4 0 0 1 .8-7.9 5 5 0 0 1 9.6 1.4A3.5 3.5 0 0 1 17 16H6z"/></svg>
    <span id="syncText">同步中</span>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v9l6 3"/><circle cx="12" cy="12" r="9"/></svg>今天</button>
  <button class="tab" data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16"/></svg>卡片</button>
  <button class="tab" data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>组词</button>
  <button class="tab" data-tab="game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 0 1 12 0v6H6z"/><path d="M9 21h6"/></svg>闯关</button>
  <button class="tab" data-tab="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V8M12 8C12 5 9 3 6 4c-2 1-2 4 0 5M12 11c0-3 3-5 6-4 2 1 2 4 0 5"/><circle cx="12" cy="12" r="9"/></svg>成长</button>
  <button class="tab" data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 0 1 14-5l2 2"/><path d="M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M18 4v5h-5"/><path d="M6 20v-5h5"/></svg>巩固</button>
  <button class="tab" data-tab="parent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>家长</button>
</div>

<div class="toast" id="toast"></div>

<!-- PIN modal -->
<div class="modal-mask hide" id="pinMask">
  <div class="modal">
    <h3 id="pinTitle">家长验证</h3>
    <p id="pinDesc">请输入 4 位数字密码</p>
    <input class="pin-input" id="pinInput" inputmode="numeric" maxlength="4" placeholder="●●●●">
    <div class="row" style="margin-top:14px;">
      <button class="btn ghost sm" id="pinCancel">取消</button>
      <button class="btn sm" id="pinOk">确定</button>
    </div>
  </div>
</div>

<script>
/* ============ 字形数据集 ============ */
/* 每个字：c 汉字 / py 拼音 / kind 类型 / story 小故事 / words 组词示例 */
const CHARSET = [
  {c:'天',py:'tiān',kind:'会意字',story:'“一”加“大”，人头顶上面就是“天”。',words:['天空','天气','春天']},
  {c:'地',py:'dì',kind:'常用字',story:'「地」是很常用的字，我们常常在「土地」「大地」里见到它。',words:['土地','大地','地上']},
  {c:'人',py:'rén',kind:'象形字',story:'一个人站着，张开两只脚，就是“人”。',words:['人们','大人','好人']},
  {c:'你',py:'nǐ',kind:'常用字',story:'「你」是很常用的字，我们常常在「你们」「你好」里见到它。',words:['你们','你好','你的']},
  {c:'我',py:'wǒ',kind:'常用字',story:'「我」是很常用的字，我们常常在「我们」「我的」里见到它。',words:['我们','我的','自我']},
  {c:'他',py:'tā',kind:'常用字',story:'「他」是很常用的字，我们常常在「他们」「他人」里见到它。',words:['他们','他人','他日']},
  {c:'一',py:'yī',kind:'指事字',story:'一横代表数量“一”。',words:['一个','一起','第一']},
  {c:'二',py:'èr',kind:'指事字',story:'两横就是“二”。',words:['二个','二月','第二']},
  {c:'三',py:'sān',kind:'指事字',story:'三横就是“三”。',words:['三个','三月','第三']},
  {c:'四',py:'sì',kind:'常用字',story:'「四」是很常用的字，我们常常在「四个」「四月」里见到它。',words:['四个','四月','第四']},
  {c:'五',py:'wǔ',kind:'常用字',story:'「五」是很常用的字，我们常常在「五个」「五月」里见到它。',words:['五个','五月','第五']},
  {c:'上',py:'shàng',kind:'指事字',story:'短横在长横上面，表示“上”。',words:['上学','上去','上面']},
  {c:'下',py:'xià',kind:'指事字',story:'短横在长横下面，表示“下”。',words:['下去','下面','坐下']},
  {c:'口',py:'kǒu',kind:'象形字',story:'嘴巴张开的形状，画出来就是“口”。',words:['门口','开口','口水']},
  {c:'耳',py:'ěr',kind:'象形字',story:'耳朵的轮廓弯弯的，画成“耳”。',words:['耳朵','左耳','右耳']},
  {c:'目',py:'mù',kind:'象形字',story:'眼睛是横着的，中间是眼珠，就是“目”。',words:['目光','耳目','题目']},
  {c:'手',py:'shǒu',kind:'象形字',story:'一只手张开五指，就是“手”。',words:['小手','手心','双手']},
  {c:'足',py:'zú',kind:'象形字',story:'脚板加上小腿，画成“足”，就是脚。',words:['手足','足球','足月']},
  {c:'站',py:'zhàn',kind:'常用字',story:'「站」是很常用的字，我们常常在「站立」「站住」里见到它。',words:['站立','站住','车站']},
  {c:'坐',py:'zuò',kind:'常用字',story:'「坐」是很常用的字，我们常常在「坐下」「坐着」里见到它。',words:['坐下','坐着','坐车']},
  {c:'日',py:'rì',kind:'象形字',story:'太阳圆圆的，中间有一点光，古人就照着太阳的样子画成了“日”。',words:['日子','日月','日光']},
  {c:'月',py:'yuè',kind:'象形字',story:'弯弯的月亮像小船，古人把月牙的形状画下来就是“月”。',words:['月亮','明月','月儿']},
  {c:'山',py:'shān',kind:'象形字',story:'三座山峰连在一起，画出来就是“山”。',words:['大山','上山','火山']},
  {c:'川',py:'chuān',kind:'象形字',story:'两山之间的小河，流成“川”。',words:['山川','平川','冰川']},
  {c:'水',py:'shuǐ',kind:'象形字',story:'弯弯流动的水波，画成三道波浪就是“水”。',words:['喝水','开水','雨水']},
  {c:'火',py:'huǒ',kind:'象形字',story:'火苗一跳一跳的，古人照着火焰画出了“火”。',words:['大火','火山','火光']},
  {c:'田',py:'tián',kind:'象形字',story:'田地被小路分成一块一块，画成“田”字。',words:['田地','水田','农田']},
  {c:'禾',py:'hé',kind:'象形字',story:'弯弯的谷穗低着头，画成“禾”（庄稼）。',words:['禾苗','禾木','锄禾']},
  {c:'六',py:'liù',kind:'常用字',story:'「六」是很常用的字，我们常常在「六个」「六月」里见到它。',words:['六个','六月','第六']},
  {c:'七',py:'qī',kind:'常用字',story:'「七」是很常用的字，我们常常在「七个」「七月」里见到它。',words:['七个','七月','第七']},
  {c:'八',py:'bā',kind:'常用字',story:'「八」是很常用的字，我们常常在「八个」「八月」里见到它。',words:['八个','八月','第八']},
  {c:'九',py:'jiǔ',kind:'常用字',story:'「九」是很常用的字，我们常常在「九个」「九月」里见到它。',words:['九个','九月','第九']},
  {c:'十',py:'shí',kind:'常用字',story:'「十」是很常用的字，我们常常在「十个」「十月」里见到它。',words:['十个','十月','第十']},
  {c:'爸',py:'bà',kind:'形声字',story:'“父”是爸爸，“巴”帮忙读音，合起来是“爸”。',words:['爸爸','老爸','爸妈']},
  {c:'妈',py:'mā',kind:'形声字',story:'“女”表示妈妈，“马”帮忙读音，就是“妈”。',words:['妈妈','大妈','爸妈']},
  {c:'大',py:'dà',kind:'象形字',story:'大人张开手臂，就是“大”。',words:['大人','大家','大树']},
  {c:'马',py:'mǎ',kind:'象形字',story:'马儿有长脸和四蹄，画成“马”。',words:['马车','白马','木马']},
  {c:'路',py:'lù',kind:'常用字',story:'「路」是很常用的字，我们常常在「马路」「路口」里见到它。',words:['马路','路口','大路']},
  {c:'土',py:'tǔ',kind:'象形字',story:'地面上一堆土，画成“土”。',words:['土地','泥土','土豆']},
  {c:'本',py:'běn',kind:'常用字',story:'「本」是很常用的字，我们常常在「书本」「本来」里见到它。',words:['书本','本来','本子']},
  {c:'学',py:'xué',kind:'常用字',story:'「学」是很常用的字，我们常常在「学习」「学生」里见到它。',words:['学习','学生','同学']},
  {c:'校',py:'xiào',kind:'常用字',story:'「校」是很常用的字，我们常常在「学校」「校园」里见到它。',words:['学校','校园','校长']},
  {c:'班',py:'bān',kind:'常用字',story:'「班」是很常用的字，我们常常在「班级」「班长」里见到它。',words:['班级','班长','上班']},
  {c:'级',py:'jí',kind:'常用字',story:'「级」是很常用的字，我们常常在「年级」「班级」里见到它。',words:['年级','班级','高级']},
  {c:'姓',py:'xìng',kind:'常用字',story:'「姓」是很常用的字，我们常常在「姓名」「姓氏」里见到它。',words:['姓名','姓氏','百姓']},
  {c:'名',py:'míng',kind:'常用字',story:'「名」是很常用的字，我们常常在「名字」「有名」里见到它。',words:['名字','有名','姓名']},
  {c:'王',py:'wáng',kind:'常用字',story:'「王」是很常用的字，我们常常在「大王」「国王」里见到它。',words:['大王','国王','王子']},
  {c:'哥',py:'gē',kind:'常用字',story:'「哥」是很常用的字，我们常常在「哥哥」「大哥」里见到它。',words:['哥哥','大哥','表哥']},
  {c:'弟',py:'dì',kind:'常用字',story:'「弟」是很常用的字，我们常常在「弟弟」「兄弟」里见到它。',words:['弟弟','兄弟','弟子']},
  {c:'画',py:'huà',kind:'常用字',story:'「画」是很常用的字，我们常常在「画画」「画家」里见到它。',words:['画画','画家','图画']},
  {c:'花',py:'huā',kind:'形声字',story:'草字头下面藏着化，就是美丽的“花”。',words:['花朵','开花','红花']},

/* ============ 状态与存储 ============ */
const DATABASE_ID='S2StOn1hT0lod7VOKTGN3S';
const KEY='wb_literacy_profile_v1';
const cloudOK = function(){ return !!(window.__SMART_PAGE__ && window.__SMART_PAGE__.database); };
let profile=null, mode='child', cardsIdx=0, quiz=null, quizDone=0, quizOk=0;

function uid(){return Math.random().toString(36).slice(2,9);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysBetween(a,b){if(!a||!b)return 99;const x=new Date(a),y=new Date(b);return Math.round((y-x)/86400000);}

function seedProfile(){
  const y=new Date(); y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  return {
    points:30, dailyGoal:10,
    learned:['日','月','山'].map(c=>({c,date:ys})),
    streak:1, lastDate:ys,
    rewards:[{id:uid(),name:'看动画片15分钟',cost:50},{id:uid(),name:'吃一次冰淇淋',cost:80},{id:uid(),name:'去公园玩一次',cost:120}],
    pending:[], history:[], voiceCount:0, recordDates:[], skipLearned:true,
    _id:null, _seeded:true
  };
}

function toProps(p){
  return {
    累计积分:{number:p.points},
    已学字:{text:JSON.stringify(p.learned)},
    当前关卡:{number:Math.floor(p.learned.length/(p.dailyGoal||10))},
    连续天数:{number:p.streak},
    最后学习日期:{text:p.lastDate||''},
    奖励配置:{text:JSON.stringify({rewards:p.rewards,pending:p.pending,history:p.history,voiceCount:p.voiceCount||0,recordDates:p.recordDates||[],skipLearned:p.skipLearned!==false})}
  };
}
function fromProps(rec){
  const p={points:rec.累计积分||0, dailyGoal:10, learned:[], streak:rec.连续天数||0, lastDate:rec.最后学习日期||'', rewards:[], pending:[], history:[], _id:rec._id};
  try{p.learned=JSON.parse(rec.已学字||'[]');}catch(e){}
  try{const r=JSON.parse(rec.奖励配置||'{}'); p.rewards=r.rewards||[]; p.pending=r.pending||[]; p.history=r.history||[]; p.voiceCount=r.voiceCount||0; p.recordDates=r.recordDates||[]; p.skipLearned=r.skipLearned!==false;}catch(e){}
  return p;
}

let syncState='offline';
function setSync(s){
  syncState=s;
  const t=document.getElementById('syncText'), i=document.getElementById('syncIcon');
  if(s==='synced'){t.textContent='已同步'; i.innerHTML='<path d="M6 16a4 4 0 0 1 .8-7.9 5 5 0 0 1 9.6 1.4A3.5 3.5 0 0 1 17 16H6z"/><path d="M8 12l3 3 5-5" stroke="#fff"/>';}
  else if(s==='syncing'){t.textContent='同步中'; i.innerHTML='<path d="M6 16a4 4 0 0 1 .8-7.9 5 5 0 0 1 9.6 1.4A3.5 3.5 0 0 1 17 16H6z"/>';}
  else {t.textContent='离线模式'; i.innerHTML='<path d="M6 16a4 4 0 0 1 .8-7.9 5 5 0 0 1 9.6 1.4A3.5 3.5 0 0 1 17 16H6z"/><path d="M3 4l18 18" stroke="#fff"/>';}
}

async function persist(){
  localStorage.setItem(KEY, JSON.stringify(profile));
  if(!cloudOK()){ setSync('offline'); return; }
  setSync('syncing');
  try{
    let id=profile._id;
    if(!id){
      const res=await window.__SMART_PAGE__.database.query({databaseId:DATABASE_ID, filter:{property:{property:'档案ID', text:{equals:'default'}}}});
      if(res.results&&res.results.length) id=res.results[0]._id;
    }
    if(id){
      await window.__SMART_PAGE__.database.updateRecord({databaseId:DATABASE_ID, recordId:id, properties:toProps(profile)});
    }else{
      const r=await window.__SMART_PAGE__.database.addRecord({databaseId:DATABASE_ID, properties:Object.assign({档案ID:{text:'default'}}, toProps(profile))});
      id=r.id;
    }
    profile._id=id;
    localStorage.setItem(KEY, JSON.stringify(profile));
    setSync('synced');
  }catch(e){ setSync('offline'); }
}

async function load(){
  let local=null;
  try{ local=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(cloudOK()){
    try{
      const res=await window.__SMART_PAGE__.database.query({databaseId:DATABASE_ID, filter:{property:{property:'档案ID', text:{equals:'default'}}}});
      if(res.results&&res.results.length){
        const p=fromProps(res.results[0]); profile=p; setSync('synced');
        if(local&&local._seeded&&!p._seeded){/*keep cloud*/}
        localStorage.setItem(KEY, JSON.stringify(profile));
        return;
      }
    }catch(e){}
  }
  if(local){ profile=local; setSync(cloud?'offline':'offline'); }
  else { profile=seedProfile(); setSync('offline'); await persist(); }
}

/* ============ 业务逻辑 ============ */
function getQueue(){
  const s=new Set(profile.learned.map(x=>x.c));
  let arr = CHARSET.filter(ch=> (profile.skipLearned===false) ? true : !s.has(ch.c));
  arr.sort((a,b)=> ((a.extra?1:0)-(b.extra?0:1)) || (a.i-b.i));
  return arr;
}
function getTodaySet(){return getQueue().slice(0,(profile.dailyGoal||10));}
function todayLearnedCount(){const t=getTodaySet().map(x=>x.c);return profile.learned.filter(x=>t.includes(x.c)).length;}

function learnChar(c){
  if(profile.learned.find(x=>x.c===c)) return;
  profile.learned.push({c,date:todayStr()});
  profile.points+=10;
  if(profile.lastDate!==todayStr()){ profile.streak = (daysBetween(profile.lastDate,todayStr())<=1)?profile.streak+1:1; profile.lastDate=todayStr(); }
  persist(); render(); toast('太棒了！学会“'+c+'” +10分');
}

function startQuiz(){
  const today=getTodaySet();
  const src = today.length? today : (profile.learned.length? profile.learned.map(x=>CHARMAP[x.c]) : getTodaySet());
  quiz = src.slice(0, Math.min(src.length, 5)).map(ch=>{
    const correct = ch.words[0];
    const others=[];
    CHARSET.forEach(o=>{ if(o.c!==ch.c) o.words.forEach(w=>{ if(w!==correct && !others.includes(w)) others.push(w); }); });
    for(let i=others.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
    const opts=[correct,...others.slice(0,2)];
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    return {char:ch.c, correct, opts};
  });
  quizDone=0; quizOk=0; quizIdx=0; render();
}

function answer(opt, btnEl){
  if(!quiz) return;
  const q=quiz[quizIdx];
  if(opt===q.correct){
    btnEl.classList.add('ok'); quizOk++; quizDone++;
    setTimeout(()=>{ if(quizDone<quiz.length){quizIdx++; render();} else {finishQuiz();} }, 650);
  }else{
    btnEl.classList.add('no');
    setTimeout(()=>btnEl.classList.remove('no'),400);
  }
}
function finishQuiz(){
  const gain=quizOk*5; profile.points+=gain; persist();
  toast('组词练习完成！答对 '+quizOk+'/'+quiz.length+'，+'+gain+'分');
  quiz=null; switchTab('game');
}

function requestRedeem(r){
  if(profile.points<r.cost){ toast('积分不够，再去学几个字吧！'); return; }
  profile.pending.push({id:uid(),name:r.name,cost:r.cost,date:todayStr()});
  persist(); toast('已请家长确认：“'+r.name+'”');
  switchTab('parent');
}
function confirmRedeem(id){
  const i=profile.pending.findIndex(p=>p.id===id); if(i<0)return;
  const p=profile.pending[i];
  profile.points-=p.cost; profile.history.push({name:p.name,cost:p.cost,date:p.date});
  profile.pending.splice(i,1); persist(); render(); toast('已兑换：“'+p.name+'”');
}
function rejectRedeem(id){
  const i=profile.pending.findIndex(p=>p.id===id); if(i<0)return;
  profile.pending.splice(i,1); persist(); render(); toast('已取消该请求');
}


/* ============ 语音跟读 & 录音 ============ */
function speak(text){
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.7; u.pitch=1.1;
    if(window.speechSynthesis){ window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
  }catch(e){}
}
let recState={active:false,rec:null,chunks:[],char:null,url:null};
async function toggleRec(btn, ch){
  if(recState.active){ try{ recState.rec.stop(); }catch(e){} return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recState.rec=new MediaRecorder(stream); recState.chunks=[]; recState.char=ch;
    recState.rec.ondataavailable=e=>{ if(e.data && e.data.size) recState.chunks.push(e.data); };
    recState.rec.onstop=()=>{
      try{
        const blob=new Blob(recState.chunks,{type:recState.rec.mimeType||'audio/webm'});
        if(recState.url) URL.revokeObjectURL(recState.url);
        recState.url=URL.createObjectURL(blob);
        stream.getTracks().forEach(t=>t.stop());
        recState.active=false;
        profile.voiceCount=(profile.voiceCount||0)+1;
        profile.recordDates=profile.recordDates||[];
        profile.recordDates.push({c:ch,date:todayStr()});
        persist();
        const card=btn.closest('.card');
        let pb=card?card.querySelector('.replay'):null;
        if(!pb && card){ pb=document.createElement('button'); pb.className='btn ghost sm replay'; card.appendChild(pb); }
        if(pb){ pb.textContent='🔊 我的声音'; pb.onclick=()=>{ const a=new Audio(recState.url); a.play(); }; }
        btn.textContent='🎤 录一录';
        toast('录音完成！累计录音 '+(profile.voiceCount)+' 次');
      }catch(e){ toast('录音保存失败'); }
    };
    recState.rec.start(); recState.active=true;
    btn.textContent='⏹ 停止录音';
    toast('开始录音，跟着读“'+ch+'”吧');
  }catch(e){ toast('无法录音，请允许使用麦克风'); }
}

/* ============ 成长记录 ============ */
function renderGrow(){
  const box=el('<div></div>');
  const total=profile.learned.length; const goal=profile.dailyGoal||10; const level=Math.floor(total/goal);
  const days=new Set(profile.learned.map(x=>x.date)).size; const voice=profile.voiceCount||0;
  box.appendChild(el('<div class="card"><div class="stat"><div class="box"><div class="v">'+total+'</div><div class="k">已学字</div></div><div class="box"><div class="v">'+days+'</div><div class="k">学习天</div></div><div class="box"><div class="v">'+voice+'</div><div class="k">录音次</div></div></div><div class="stat" style="margin-top:10px"><div class="box"><div class="v">'+profile.points+'</div><div class="k">我的积分</div></div><div class="box"><div class="v">第'+level+'关</div><div class="k">当前关卡</div></div><div class="box"><div class="v">'+profile.streak+'</div><div class="k">连续天</div></div></div></div>'));
  const TOTAL=CHARSET.length;
  const pct=Math.min(100,Math.round(total/TOTAL*100));
  box.appendChild(el('<div class="card"><h2><span class="dot"></span>识字总进度</h2><div class="muted">已经认识 '+total+' / '+TOTAL+' 个字</div><div class="progress"><i style="width:'+pct+'%"></i></div></div>'));
  const ms=[10,30,50,100,150,200,280]; if(TOTAL>280 && !ms.includes(TOTAL)) ms.push(TOTAL); const next=ms.find(m=>total<m);
  let mh='<div class="card"><h2><span class="dot"></span>成长里程碑</h2><div class="today-grid">';
  ms.forEach(m=>{ const ok=total>=m; mh+='<div class="tchip '+(ok?'done':'')+'">'+(ok?'★':'·')+'<div style="font-size:10px;margin-top:2px">'+m+'字</div></div>'; });
  mh+='</div>';
  if(next) mh+='<div class="muted" style="text-align:center;margin-top:8px">再学 '+(next-total)+' 个字，解锁「'+next+'字」里程碑！</div>';
  else mh+='<div class="muted" style="text-align:center;margin-top:8px">🏆 全部 '+TOTAL+' 字都学会啦，太了不起了！</div>';
  mh+='</div>'; box.appendChild(el(mh));
  const byDate={}; profile.learned.forEach(x=>{ byDate[x.date]=(byDate[x.date]||0)+1; });
  const dates=Object.keys(byDate).sort().reverse().slice(0,12);
  let ch='<div class="card"><h2><span class="dot"></span>学习日历</h2>';
  if(dates.length===0) ch+='<div class="empty">还没有学习记录，去「今天」学第一个字吧！</div>';
  else{ ch+='<div style="display:flex;flex-direction:column;gap:8px">'; dates.forEach(d=>{ ch+='<div class="list-item"><span class="nm">'+d+'</span><span class="meta">学了 '+byDate[d]+' 个字</span></div>'; }); ch+='</div>'; }
  ch+='</div>'; box.appendChild(el(ch));
  const recs=profile.recordDates||[];
  if(recs.length){ let rh='<div class="card"><h2><span class="dot"></span>我的录音</h2><div style="display:flex;flex-wrap:wrap;gap:6px">'; recs.slice(-20).forEach(r=>{ rh+='<span class="badge">'+r.c+'</span>'; }); rh+='</div></div>'; box.appendChild(el(rh)); }
  if(profile.history&&profile.history.length){ let hh='<div class="card"><h2><span class="dot"></span>已兑换奖励</h2><div style="display:flex;flex-direction:column;gap:8px">'; profile.history.slice().reverse().forEach(h=>{ hh+='<div class="list-item"><span class="nm">'+h.name+'</span><span class="meta">'+h.cost+'分 · '+h.date+'</span></div>'; }); hh+='</div></div>'; box.appendChild(el(hh)); }
  return box;
}


/* ============ 巩固复习 ============ */
function renderReview(){
  const box=el('<div></div>');
  const total=profile.learned.length;
  box.appendChild(el('<div class="card"><div class="stat"><div class="box"><div class="v">'+total+'</div><div class="k">已学汉字</div></div><div class="box"><div class="v">'+CHARSET.length+'</div><div class="k">字库总数</div></div><div class="box"><div class="v">'+Math.round(total/(CHARSET.length||1)*100)+'%</div><div class="k">掌握率</div></div></div>'+
    '<button class="btn sec" id="startReview" style="margin-top:12px">🎯 开始巩固复习</button></div>'));
  if(total===0){ box.appendChild(el('<div class="card"><div class="empty">还没有学会的字，去「今天」学几个吧！</div></div>')); return box; }
  const byDate={}; profile.learned.forEach(x=>{ if(!(x.c in byDate)) byDate[x.c]=x.date; });
  const ordered=[...new Set(profile.learned.map(x=>x.c))].sort((a,b)=> (byDate[a]<byDate[b]?-1:byDate[a]>byDate[b]?1:0));
  const grid=el('<div class="card"><h2><span class="dot"></span>所有已学汉字（'+ordered.length+'）</h2><div class="today-grid" id="revGrid"></div><div class="muted" style="margin-top:8px">点一下字可以听发音；需要巩固的字排在前面。</div></div>');
  box.appendChild(grid);
  setTimeout(()=>{
    const g=document.getElementById('revGrid'); if(!g) return;
    ordered.forEach(c=>{
      const cm=CHARMAP[c]; if(!cm) return;
      const chip=el('<div class="tchip" title="'+cm.py+'">'+c+'</div>');
      chip.style.fontSize='22px';
      chip.onclick=()=>{ speak(c); toast(c+'  ·  '+cm.py); };
      g.appendChild(chip);
    });
    const sb=document.getElementById('startReview');
    if(sb) sb.onclick=()=>startReview(ordered);
  },0);
  return box;
}
function startReview(ordered){
  const pool=(ordered&&ordered.length?ordered:profile.learned.map(x=>x.c)).map(c=>CHARMAP[c]).filter(Boolean);
  if(pool.length===0){ toast('还没有学会的字'); return; }
  quiz = pool.slice(0, Math.min(pool.length, 10)).map(ch=>{
    const correct = ch.words[0];
    const others=[];
    CHARSET.forEach(o=>{ if(o.c!==ch.c) o.words.forEach(w=>{ if(w!==correct && !others.includes(w)) others.push(w); }); });
    for(let i=others.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
    const opts=[correct,...others.slice(0,2)];
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
    return {char:ch.c, correct, opts};
  });
  quizDone=0; quizOk=0; quizIdx=0; currentTab='quiz'; mode='child'; render();
  toast('巩固复习：选出含有这个字的词');
}

/* ============ 渲染 ============ */
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

function render(){
  document.getElementById('greet').textContent = mode==='parent' ? '家长管理后台' : (profile.points>=0?'小朋友的认字乐园':'');
  const app=document.getElementById('app'); app.innerHTML='';
  if(mode==='parent'){ app.appendChild(renderParent()); }
  else {
    if(currentTab==='today') app.appendChild(renderToday());
    else if(currentTab==='cards') app.appendChild(renderCards());
    else if(currentTab==='quiz') app.appendChild(renderQuiz());
    else if(currentTab==='game') app.appendChild(renderGame());
    else if(currentTab==='grow') app.appendChild(renderGrow());
    else if(currentTab==='review') app.appendChild(renderReview());
  }
  // tab highlight
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===currentTab && mode==='child'));
}

function renderCards(){
  const set=getTodaySet();

function btn(label,cls,fn){const b=el('<button class="btn '+(cls||'')+'">'+label+'</button>'); b.addEventListener('click',fn); return b;}

/* ============ 导入/导出 ============ */
function exportJSON(){
  const blob=new Blob([JSON.stringify(profile,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='识字启蒙备份.json'; a.click();
  toast('已导出备份');
}
function importJSON(e){
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); profile=Object.assign(seedProfile(),d); persist(); render(); toast('已恢复备份'); }catch(err){ toast('文件格式有误'); } };
  r.readAsText(f);
}

/* ============ 导航 & PIN ============ */
let currentTab='today';
function switchTab(t){
  if(t==='parent'){ openParentGate(); return; }
  mode='child'; currentTab=t;
  if(t==='cards') cardsIdx=0;
  if(t==='quiz' && !quiz) startQuiz();
  render();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

let pinAction=null;
function openParentGate(){
  const saved=localStorage.getItem('wb_literacy_pin');
  const mask=document.getElementById('pinMask');
  const title=document.getElementById('pinTitle'), desc=document.getElementById('pinDesc'), inp=document.getElementById('pinInput');
  inp.value='';
  if(saved===null){ title.textContent='设置家长密码'; desc.textContent='首次进入，请设置 4 位数字密码（小朋友看不到）'; }
  else { title.textContent='家长验证'; desc.textContent='请输入 4 位数字密码'; }
  mask.classList.remove('hide'); inp.focus();
  pinAction=(val)=>{
    if(saved===null){ if(/^\d{4}$/.test(val)){ localStorage.setItem('wb_literacy_pin',val); mode='parent'; currentTab='parent'; mask.classList.add('hide'); render(); toast('家长模式已开启'); } else { toast('请输入4位数字'); } }
    else { if(val===saved){ mode='parent'; currentTab='parent'; mask.classList.add('hide'); render(); } else { toast('密码错误'); } }
  };
}
document.getElementById('pinOk').onclick=()=>{ if(pinAction) pinAction(document.getElementById('pinInput').value); };
document.getElementById('pinCancel').onclick=()=>document.getElementById('pinMask').classList.add('hide');
document.getElementById('pinInput').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);});
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pinOk').click();});

/* ============ 启动 ============ */
(async function(){
  setSync('syncing');
  await load();
  if(!profile.dailyGoal) profile.dailyGoal=10;
  render();
})();
</script>
